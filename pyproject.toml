[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-forecast-lab"
version = "0.1.0"
description = "A modular Bitcoin forecasting research application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "streamlit>=1.63",
  "yfinance>=1.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
